app = "beeftv-canvas"
primary_region = "hkg"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  GIN_MODE = "release"
  CANVAS_BACKEND_ADDR = ":8080"
  CANVAS_BACKEND_DATA_DIR = "/data"
  CANVAS_AUTO_MIGRATE = "true"
  CANVAS_DATABASE_DRIVER = "sqlite"
  CANVAS_CORS_ORIGINS = ""
  BEEFTV_ALLOWED_ORIGINS = ""
  BEEFTV_UI_BOOTSTRAP = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "beeftv_data"
  destination = "/data"
  size_gb = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
